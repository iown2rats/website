<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MelloCrush</title>
    <!--
      The only page this app carries. It is never shown while the device can reach mellocrush.com: Capacitor is
      configured with a remote server URL, so the WebView goes straight there. This is what remains if that
      navigation fails outright — an offline phone, a DNS failure — and it exists so the alternative is not a
      blank white rectangle with no explanation.

      Deliberately self-contained: no fonts, no scripts, no network of any kind, because the one situation it
      appears in is the one where the network is gone. Colours are the app's own tokens.
    -->
    <style>
      :root { color-scheme: light dark; --bg: #fffbf1; --ink: #2b2b2b; --muted: #6b6560; --coral: #fd7979; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #f4f1ec; --muted: #a09a94; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink); text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 20rem; }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: var(--muted); }
      button {
        height: 48px; width: 100%; border: 0; border-radius: 999px;
        background: var(--coral); color: #fff; font-size: 15px; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MelloCrush can't connect</h1>
      <p>Check your connection and try again.</p>
      <button type="button" onclick="location.replace('https://www.mellocrush.com/')">Try again</button>
    </main>
  </body>
</html>
